<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share card for the EXPLORER page. og-image.svg is the teardown's card; this
  one drops the "product teardown" kicker and leads with what the tool does,
  because somebody clicking a link to the explorer wants to know what they will
  see, not that an essay exists about it. og-tool.png is rendered from this file
  at 2x, 2400x1254. The render command is in the README.

  LAYOUT IS CENTERED ON PURPOSE. LinkedIn's profile "Featured" section does not
  honor the 1.91:1 ratio: it center-crops into a roughly square frame, which
  throws away half the width. Every element lives inside a 540px-wide center
  column (x 330..870) so it survives that crop.

  The illustration is one finding card as the explorer actually draws it: a
  type tag, a demand count, the missing fact, and the proof path underneath.
  The proof is what the tool is for, so it gets the space.

  Colors are literal values from tokens.css dark mapping. An SVG cannot read a
  stylesheet and this file must not fetch anything. System font stack only.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">

  <rect width="1200" height="627" fill="#10141a"/>

  <!-- ============ one finding card, with its proof path open ============ -->

  <rect x="450" y="58" width="300" height="222" rx="14" fill="#1b2028" stroke="#3f4653" stroke-width="2"/>

  <!-- type tag and the number of people who asked -->
  <rect x="470" y="78" width="74" height="18" rx="9" fill="#68231a" stroke="#f5bcb2" stroke-width="1.5"/>
  <text x="507" y="91" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.6" fill="#ea9384">NEAR MISS</text>
  <text x="730" y="92" text-anchor="end"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" fill="#f7f8f9">6 asked</text>

  <!-- the concept, and the fact nobody wrote -->
  <rect x="470" y="112" width="122" height="12" rx="6" fill="#c8ced7"/>
  <rect x="470" y="134" width="196" height="8" rx="4" fill="#3f4653"/>
  <rect x="470" y="150" width="152" height="8" rx="4" fill="#3f4653"/>

  <!-- the proof path: two evidence spans, then the absence -->
  <rect x="468" y="176" width="3" height="88" rx="1.5" fill="#2b7d94"/>

  <rect x="484" y="176" width="88" height="7" rx="3.5" fill="#4c9bb0"/>
  <rect x="484" y="189" width="216" height="14" rx="3" fill="#0b2129" stroke="#1a4f60" stroke-width="1"/>
  <rect x="491" y="194" width="150" height="4" rx="2" fill="#4c9bb0" opacity="0.55"/>

  <rect x="484" y="214" width="76" height="7" rx="3.5" fill="#4c9bb0"/>
  <rect x="484" y="227" width="196" height="14" rx="3" fill="#0b2129" stroke="#1a4f60" stroke-width="1"/>
  <rect x="491" y="232" width="126" height="4" rx="2" fill="#4c9bb0" opacity="0.55"/>

  <rect x="484" y="249" width="246" height="15" rx="4" fill="#68231a" stroke="#f5bcb2" stroke-width="1.2"/>
  <text x="607" y="259.5" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.5" fill="#ea9384">0 OF 570 SECTIONS EXPLAIN IT</text>

  <!-- ============ type ============ -->

  <text x="600" y="330" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="700" letter-spacing="3.4" fill="#4c9bb0">FINDINGS EXPLORER</text>

  <text x="600" y="404" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#f7f8f9">Should My Agent</text>
  <text x="600" y="456" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#f7f8f9">Answer This?</text>

  <rect x="545" y="484" width="110" height="5" rx="2.5" fill="#4c9bb0"/>

  <text x="600" y="535" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#c8ced7">153 findings against real documentation,</text>
  <text x="600" y="570" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#c8ced7">each with the sentence behind it</text>

</svg>
