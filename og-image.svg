<?xml version="1.0" encoding="UTF-8"?>
<!--
  Share card for the TEARDOWN page. The coordinate space is 1200x627 (the Open
  Graph large-summary ratio); og-image.png is rendered from this file at 2x,
  2400x1254, because a 1x asset gets scaled up on high-DPI screens and softens.
  Edit here, not there. Render command is in the README.

  LAYOUT IS CENTERED ON PURPOSE. LinkedIn's profile "Featured" section does not
  honor the 1.91:1 ratio: it center-crops into a roughly square frame, which
  throws away half the width. Every element lives inside a 540px-wide center
  column (x 330..870) so it survives that crop and still reads as a deliberate
  centered card at full width. Same rule as agent-answer, save-the-dates and
  ai-property-maintenance-advisor.

  The illustration is the product's whole argument in one picture: a question
  somebody asked, an article whose instructions lean on the thing they asked
  about, and nothing anywhere that explains it. Two arrows present, one absent.
  The absence is the finding, so it carries the only words on the card.

  Colors are literal values from tokens.css. An SVG cannot read a stylesheet,
  and this file must not fetch anything. Fonts are a plain system stack.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">

  <rect width="1200" height="627" fill="#10141a"/>

  <!-- ============ a near miss: two arrows present, one absent ============ -->

  <rect x="450" y="58" width="300" height="222" rx="14" fill="#1b2028" stroke="#3f4653" stroke-width="2"/>

  <!-- the concept everything below turns on -->
  <rect x="470" y="80" width="144" height="11" rx="5.5" fill="#6f7887"/>
  <rect x="470" y="99" width="88" height="7" rx="3.5" fill="#2b313b"/>

  <line x1="470" y1="121" x2="730" y2="121" stroke="#2b313b" stroke-width="2"/>

  <!-- present: people asked about it -->
  <rect x="470" y="141" width="104" height="9" rx="4.5" fill="#c8ced7"/>
  <rect x="592" y="136" width="138" height="19" rx="9.5" fill="#1a4f60" stroke="#4c9bb0" stroke-width="1.5"/>
  <text x="661" y="149.5" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="0.7" fill="#7fbdcd">ASKED ABOUT</text>

  <!-- present: an article's instructions lean on it -->
  <rect x="470" y="181" width="126" height="9" rx="4.5" fill="#c8ced7"/>
  <rect x="592" y="176" width="138" height="19" rx="9.5" fill="#1a4f60" stroke="#4c9bb0" stroke-width="1.5"/>
  <text x="661" y="189.5" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="0.7" fill="#7fbdcd">DEPENDED ON</text>

  <line x1="470" y1="215" x2="730" y2="215" stroke="#2b313b" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- absent: nothing in the documentation explains it -->
  <rect x="470" y="235" width="80" height="9" rx="4.5" fill="#3f4653"/>
  <line x1="464" y1="239.5" x2="556" y2="239.5" stroke="#d96450" stroke-width="3" stroke-linecap="round"/>
  <text x="730" y="244" text-anchor="end"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="0.6" fill="#d96450">NEVER EXPLAINED</text>

  <!-- ============ type ============ -->

  <text x="600" y="330" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="700" letter-spacing="3.4" fill="#4c9bb0">PRODUCT TEARDOWN</text>

  <text x="600" y="404" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#f7f8f9">Should My Agent</text>
  <text x="600" y="456" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#f7f8f9">Answer This?</text>

  <rect x="545" y="484" width="110" height="5" rx="2.5" fill="#4c9bb0"/>

  <text x="600" y="535" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#c8ced7">Finds the articles that make an AI</text>
  <text x="600" y="570" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="400" fill="#c8ced7">assistant answer confidently and wrong</text>

</svg>
